<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forks & Frames</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --cream:    #fdf6ec;
  --gold:     #c8941f;
  --gold-lt:  #f0c84a;
  --brown:    #3e1f05;
  --rose:     #e05c7a;
  --coral:    #f07040;
  --mauve:    #b05080;
  --sage:     #4a8c5c;
  --lavender: #8060c0;
  --sky:      #4090d0;
  --peach:    #f0a060;
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  background: var(--cream);
  font-family: 'Cormorant Garamond', serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ═══════════════════════════════
   ANIMATED FLORAL CANVAS (CSS only)
═══════════════════════════════ */

/* Full-page SVG floral layer */
.floral-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

/* Spinning center rosettes */
.rosette {
  position: absolute;
  animation: spinRosette linear infinite;
  opacity: 0.18;
  transform-origin: center;
}
@keyframes spinRosette {
  from { transform: rotate(0deg) scale(1); opacity: 0.18; }
  50%  { opacity: 0.28; transform: rotate(180deg) scale(1.08); }
  to   { transform: rotate(360deg) scale(1); opacity: 0.18; }
}

/* Floating petal drift */
.drift {
  position: absolute;
  bottom: -80px;
  opacity: 0;
  animation: driftUp linear infinite;
}
@keyframes driftUp {
  0%   { transform: translateY(0) rotate(0deg) scale(0.7);  opacity: 0; }
  8%   { opacity: 1; }
  88%  { opacity: 0.8; }
  100% { transform: translateY(-110vh) rotate(600deg) scale(1.1); opacity: 0; }
}

/* Swaying vines on sides */
.vine-side {
  position: fixed;
  top: 0; bottom: 0;
  width: 130px;
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  animation: vineFade 1.4s 0.5s ease forwards;
}
.vine-left  { left: 0; }
.vine-right { right: 0; transform: scaleX(-1); }
@keyframes vineFade { to { opacity: 1; } }

.vine-side svg {
  width: 100%;
  height: 100%;
}

/* Blossoms that pop in */
.blossom {
  position: absolute;
  animation: blossomPop ease-in-out infinite alternate;
  transform-origin: center bottom;
}
@keyframes blossomPop {
  0%   { transform: scale(0.92) rotate(-4deg); }
  100% { transform: scale(1.06) rotate(4deg);  }
}

/* ═══════════════════════════════
   PAGE LAYOUT
═══════════════════════════════ */
.page {
  position: relative;
  z-index: 1;
  max-width: 620px;
  margin: 0 auto;
  padding: 36px 20px 80px;
}

/* ── Banner ── */
.banner-wrap {
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 12px 60px rgba(62,31,5,0.22), 0 0 0 2px rgba(240,200,74,0.35);
  animation: pageRise 1s cubic-bezier(.22,1,.36,1) both;
  position: relative;
}
.banner-wrap img { width:100%; display:block; }
.banner-wrap::after {
  content:'';
  position:absolute; inset:0;
  border-radius:24px;
  background: linear-gradient(160deg, rgba(176,80,128,0.08) 0%, transparent 50%, rgba(200,148,31,0.12) 100%);
  pointer-events:none;
}

/* ── Logo ── */
.logo-area {
  display: flex; flex-direction: column; align-items: center;
  margin-top: -56px;
  animation: pageRise 0.9s 0.1s cubic-bezier(.22,1,.36,1) both;
}
.logo-medal {
  width: 114px; height: 114px;
  border-radius: 50%;
  border: 5px solid white;
  box-shadow: 0 0 0 3px var(--gold-lt),
              0 0 0 6px rgba(240,200,74,0.25),
              0 14px 50px rgba(62,31,5,0.25);
  overflow: hidden;
  position: relative;
  z-index: 2;
  animation: medalPulse 4s ease-in-out infinite;
}
@keyframes medalPulse {
  0%,100% { box-shadow: 0 0 0 3px var(--gold-lt), 0 0 0 6px rgba(240,200,74,0.25), 0 14px 50px rgba(62,31,5,0.25); }
  50%      { box-shadow: 0 0 0 5px var(--gold-lt), 0 0 0 10px rgba(240,200,74,0.18), 0 18px 60px rgba(62,31,5,0.28); }
}
.logo-medal img { width:100%;height:100%;object-fit:cover;border-radius:50%; }

/* Petal ring around logo */
.petal-ring {
  position: absolute;
  width: 160px; height: 160px;
  margin-top: -137px;
  pointer-events: none;
  animation: spinRosette 18s linear infinite;
  opacity: 0.55;
}

.brand-name {
  font-family: 'Cinzel', serif;
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--brown);
  text-align: center;
  margin-top: 20px;
  background: linear-gradient(135deg, #3e1f05 30%, #c8941f 60%, #3e1f05 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmerText 4s ease-in-out infinite;
  background-size: 200%;
}
@keyframes shimmerText {
  0%,100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}

/* Decorative floral divider */
.floral-divider {
  display: flex; align-items: center; gap: 10px;
  margin: 8px auto 6px;
  width: fit-content;
  animation: pageRise 0.8s 0.2s both;
}
.div-line { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.div-line.rev { background: linear-gradient(90deg, var(--gold), transparent); }

.tagline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.05rem;
  color: #7a4822;
  letter-spacing: 0.06em;
  text-align: center;
  margin-bottom: 36px;
  animation: pageRise 0.8s 0.25s both;
}

/* ── Section label ── */
.section-lbl {
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
  text-align: center;
  margin-bottom: 22px;
  animation: pageRise 0.8s 0.3s both;
  position: relative;
}
.section-lbl::before, .section-lbl::after {
  content: '✦';
  margin: 0 10px;
  color: var(--rose);
  animation: twinkle 2s ease-in-out infinite;
}
.section-lbl::after { animation-delay: 1s; }
@keyframes twinkle {
  0%,100% { opacity: 0.5; transform: scale(0.8); }
  50%      { opacity: 1;   transform: scale(1.2); }
}

/* ── QR Cards ── */
.qr-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.qr-card {
  border-radius: 26px;
  padding: 22px 14px 22px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-decoration: none;
  position: relative; overflow: hidden;
  transition: transform 0.4s cubic-bezier(.22,1,.36,1), box-shadow 0.4s ease;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

/* Unique card gradients */
.card-ig  {
  background: linear-gradient(145deg, rgba(255,245,250,0.9) 0%, rgba(255,220,235,0.85) 100%);
  box-shadow: 0 8px 36px rgba(224,92,122,0.2), inset 0 1px 0 rgba(255,255,255,0.8);
  animation: pageRise 0.8s 0.38s both;
}
.card-yt  {
  background: linear-gradient(145deg, rgba(255,245,240,0.9) 0%, rgba(255,220,200,0.85) 100%);
  box-shadow: 0 8px 36px rgba(240,112,64,0.2), inset 0 1px 0 rgba(255,255,255,0.8);
  animation: pageRise 0.8s 0.48s both;
}
.card-fb  {
  background: linear-gradient(145deg, rgba(240,245,255,0.9) 0%, rgba(210,225,255,0.85) 100%);
  box-shadow: 0 8px 36px rgba(64,144,208,0.2), inset 0 1px 0 rgba(255,255,255,0.8);
  animation: pageRise 0.8s 0.58s both;
}

.qr-card:hover {
  transform: translateY(-10px) scale(1.04) rotate(-0.5deg);
}
.card-ig:hover  { box-shadow: 0 22px 55px rgba(224,92,122,0.3); }
.card-yt:hover  { box-shadow: 0 22px 55px rgba(240,112,64,0.3); }
.card-fb:hover  { box-shadow: 0 22px 55px rgba(64,144,208,0.3); }

/* Animated top shimmer */
.qr-card::before {
  content: '';
  position: absolute; top: 0; left: -100%; right: -100%; height: 3px;
  border-radius: 26px 26px 0 0;
  transition: opacity 0.3s;
  opacity: 0;
}
.card-ig::before  { background: linear-gradient(90deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
.card-yt::before  { background: linear-gradient(90deg,#ff6b6b,#ff0000,#cc0000); }
.card-fb::before  { background: linear-gradient(90deg,#4facfe,#1877f2,#1251a3); }
.qr-card:hover::before { opacity: 1; }

/* Corner flower */
.card-flower {
  position: absolute;
  font-size: 1.6rem;
  opacity: 0;
  transition: opacity 0.4s, transform 0.4s;
  transform: scale(0.3) rotate(-45deg);
  top: 8px; right: 10px;
  line-height: 1;
}
.card-ig  .card-flower { color: #e8509a; }
.card-yt  .card-flower { color: #ff7040; }
.card-fb  .card-flower { color: #5090e0; }
.qr-card:hover .card-flower { opacity: 1; transform: scale(1) rotate(10deg); }

/* Bottom left leaf */
.card-leaf {
  position: absolute;
  bottom: 6px; left: 8px;
  font-size: 1.1rem;
  opacity: 0;
  transition: opacity 0.4s 0.1s, transform 0.4s;
  transform: scale(0.3);
  color: var(--sage);
}
.qr-card:hover .card-leaf { opacity: 0.7; transform: scale(1); }

/* ── Platform badges ── */
.badge {
  width: 50px; height: 50px;
  border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  overflow: hidden;
}
.badge::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.2);
  border-radius: 15px;
  transition: opacity 0.3s;
  opacity: 0;
}
.qr-card:hover .badge::after { opacity: 1; }

.badge-ig  { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
.badge-yt  { background: linear-gradient(135deg,#ff6b6b,#ff0000); }
.badge-fb  { background: linear-gradient(135deg,#4facfe,#1877f2); }
.badge svg { width:26px;height:26px;fill:white;position:relative;z-index:1; }

.plat-name {
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  letter-spacing: 0.16em;
  color: var(--brown);
  font-weight: 600;
}

/* ── QR box ── */
.qr-box {
  width: 94px; height: 94px;
  background: white;
  border-radius: 12px;
  padding: 5px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.card-ig .qr-box  { box-shadow: 0 3px 14px rgba(224,92,122,0.2); border: 1.5px solid rgba(224,92,122,0.2); }
.card-yt .qr-box  { box-shadow: 0 3px 14px rgba(255,80,40,0.18); border: 1.5px solid rgba(255,80,40,0.18); }
.card-fb .qr-box  { box-shadow: 0 3px 14px rgba(64,144,208,0.2); border: 1.5px solid rgba(64,144,208,0.2); }
.qr-box canvas { border-radius: 7px; }

.scan-hint {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.7rem;
  color: #7a4822;
  letter-spacing: 0.04em;
}

/* ── Follow buttons — minimal pill, lives inside card ── */
.follow-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 18px 6px 14px;
  border-radius: 40px;
  font-family: 'Cinzel', serif;
  font-size: 0.58rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-decoration: none;
  position: relative;
  overflow: hidden;
  border: 1.5px solid transparent;
  transition: transform 0.35s cubic-bezier(.22,1,.36,1),
              box-shadow 0.35s ease,
              letter-spacing 0.35s ease;
  /* Arrow that slides in */
  background-clip: padding-box;
}

/* Animated sliding shimmer line */
.follow-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -120%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  transform: skewX(-20deg);
  animation: btnShimmer 3s ease-in-out infinite;
}
@keyframes btnShimmer {
  0%   { left: -120%; }
  50%  { left: 140%; }
  100% { left: 140%; }
}

/* Arrow icon inside button */
.follow-btn .btn-arrow {
  display: inline-flex;
  align-items: center;
  font-size: 0.7rem;
  transition: transform 0.3s cubic-bezier(.22,1,.36,1);
  line-height: 1;
}
.follow-btn:hover .btn-arrow { transform: translateX(4px); }

.follow-btn:hover {
  transform: scale(1.06);
  letter-spacing: 0.22em;
}

/* Ghost pill style — transparent bg, colored border & text, fills on hover */
.btn-ig {
  color: #c0305a;
  border-color: rgba(192,48,90,0.4);
  background: rgba(255,230,240,0.55);
  box-shadow: 0 2px 12px rgba(224,92,122,0.12);
}
.btn-ig:hover {
  background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#bc1888);
  border-color: transparent;
  color: white;
  box-shadow: 0 6px 22px rgba(220,39,67,0.35);
}

.btn-yt {
  color: #c02020;
  border-color: rgba(192,32,32,0.4);
  background: rgba(255,230,225,0.55);
  box-shadow: 0 2px 12px rgba(255,80,40,0.12);
}
.btn-yt:hover {
  background: linear-gradient(135deg,#ff5555,#ff0000,#cc0000);
  border-color: transparent;
  color: white;
  box-shadow: 0 6px 22px rgba(200,0,0,0.35);
}

.btn-fb {
  color: #1050a0;
  border-color: rgba(24,119,242,0.35);
  background: rgba(220,232,255,0.55);
  box-shadow: 0 2px 12px rgba(64,144,208,0.12);
}
.btn-fb:hover {
  background: linear-gradient(135deg,#4facfe,#1877f2,#1251a3);
  border-color: transparent;
  color: white;
  box-shadow: 0 6px 22px rgba(24,119,242,0.38);
}

/* ── Floral footer band ── */
.footer-flowers {
  display: flex; justify-content: center; align-items: center; gap: 6px;
  margin: 32px 0 14px;
  animation: pageRise 0.7s 0.7s both;
}
.footer-flowers span {
  display: inline-block;
  font-size: 1.4rem;
  animation: floatFlower ease-in-out infinite alternate;
}
.footer-flowers span:nth-child(odd)  { animation-duration: 2.2s; }
.footer-flowers span:nth-child(even) { animation-duration: 2.8s; animation-delay: -1s; }
@keyframes floatFlower {
  from { transform: translateY(0) rotate(-6deg); }
  to   { transform: translateY(-7px) rotate(6deg); }
}

.footer-text {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.82rem;
  color: rgba(62,31,5,0.45);
  letter-spacing: 0.1em;
  animation: pageRise 0.7s 0.8s both;
}

@keyframes pageRise {
  from { opacity:0; transform: translateY(32px); }
  to   { opacity:1; transform: translateY(0); }
}

@media (max-width:460px) {
  .qr-grid { grid-template-columns:1fr; max-width:240px; margin:0 auto; }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════
     FLORAL BACKGROUND LAYER
════════════════════════════════ -->
<div class="floral-layer" id="floralLayer">

  <!-- Big spinning rosettes -->
  <svg class="rosette" style="width:320px;height:320px;top:-80px;left:-80px;animation-duration:40s;" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(100,100)">
      <g><ellipse cx="0" cy="-50" rx="14" ry="30" fill="#e05c7a" transform="rotate(0)"/><ellipse cx="0" cy="-50" rx="14" ry="30" fill="#f07040" transform="rotate(40)"/><ellipse cx="0" cy="-50" rx="14" ry="30" fill="#c8941f" transform="rotate(80)"/><ellipse cx="0" cy="-50" rx="14" ry="30" fill="#b05080" transform="rotate(120)"/><ellipse cx="0" cy="-50" rx="14" ry="30" fill="#4a8c5c" transform="rotate(160)"/><ellipse cx="0" cy="-50" rx="14" ry="30" fill="#8060c0" transform="rotate(200)"/><ellipse cx="0" cy="-50" rx="14" ry="30" fill="#4090d0" transform="rotate(240)"/><ellipse cx="0" cy="-50" rx="14" ry="30" fill="#e05c7a" transform="rotate(280)"/><ellipse cx="0" cy="-50" rx="14" ry="30" fill="#f0a060" transform="rotate(320)"/></g>
      <circle r="18" fill="#f0c84a"/>
      <circle r="8" fill="white"/>

  </svg>

  <svg class="rosette" style="width:260px;height:260px;bottom:-60px;right:-60px;animation-duration:55s;animation-direction:reverse;" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(100,100)">
      <g><ellipse cx="0" cy="-45" rx="12" ry="26" fill="#4090d0" transform="rotate(0)"/><ellipse cx="0" cy="-45" rx="12" ry="26" fill="#8060c0" transform="rotate(45)"/><ellipse cx="0" cy="-45" rx="12" ry="26" fill="#e05c7a" transform="rotate(90)"/><ellipse cx="0" cy="-45" rx="12" ry="26" fill="#4a8c5c" transform="rotate(135)"/><ellipse cx="0" cy="-45" rx="12" ry="26" fill="#f07040" transform="rotate(180)"/><ellipse cx="0" cy="-45" rx="12" ry="26" fill="#c8941f" transform="rotate(225)"/><ellipse cx="0" cy="-45" rx="12" ry="26" fill="#b05080" transform="rotate(270)"/><ellipse cx="0" cy="-45" rx="12" ry="26" fill="#4090d0" transform="rotate(315)"/></g>
      <circle r="16" fill="#e05c7a"/>
      <circle r="7" fill="white"/>
    </g>
  </svg>

  <svg class="rosette" style="width:180px;height:180px;top:40%;left:5%;animation-duration:30s;" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(100,100)">
      <g><ellipse cx="0" cy="-40" rx="10" ry="22" fill="#c8941f" transform="rotate(0)"/><ellipse cx="0" cy="-40" rx="10" ry="22" fill="#f07040" transform="rotate(60)"/><ellipse cx="0" cy="-40" rx="10" ry="22" fill="#e05c7a" transform="rotate(120)"/><ellipse cx="0" cy="-40" rx="10" ry="22" fill="#8060c0" transform="rotate(180)"/><ellipse cx="0" cy="-40" rx="10" ry="22" fill="#4a8c5c" transform="rotate(240)"/><ellipse cx="0" cy="-40" rx="10" ry="22" fill="#4090d0" transform="rotate(300)"/></g>
      <circle r="14" fill="#f0c84a"/>
      <circle r="6" fill="white"/>
    </g>
  </svg>

  <svg class="rosette" style="width:160px;height:160px;top:30%;right:4%;animation-duration:38s;animation-direction:reverse;" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(100,100)">
      <g><ellipse cx="0" cy="-38" rx="9" ry="20" fill="#b05080" transform="rotate(0)"/><ellipse cx="0" cy="-38" rx="9" ry="20" fill="#4090d0" transform="rotate(60)"/><ellipse cx="0" cy="-38" rx="9" ry="20" fill="#c8941f" transform="rotate(120)"/><ellipse cx="0" cy="-38" rx="9" ry="20" fill="#4a8c5c" transform="rotate(180)"/><ellipse cx="0" cy="-38" rx="9" ry="20" fill="#e05c7a" transform="rotate(240)"/><ellipse cx="0" cy="-38" rx="9" ry="20" fill="#8060c0" transform="rotate(300)"/></g>
      <circle r="13" fill="#f07040"/>
      <circle r="5" fill="white"/>
    </g>
  </svg>

</div>

<!-- Vine sides -->
<div class="vine-side vine-left">
  <svg viewBox="0 0 130 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Main curling stem -->
    <path d="M20,800 Q50,720 20,640 Q-10,560 40,480 Q70,400 20,320 Q-10,240 40,160 Q60,100 30,40" fill="none" stroke="#4a8c5c" stroke-width="1.5" opacity="0.5"/>
    <!-- Roses and florals along stem -->
    <!-- Rose 1 at 640 -->
    <g transform="translate(20,640)"><circle r="12" fill="#e05c7a" opacity="0.7"/><circle r="7" fill="#f07090" opacity="0.8"/><circle r="3" fill="#fff0f4"/><ellipse cx="-8" cy="-8" rx="7" ry="10" fill="#f09ab0" opacity="0.5" transform="rotate(-30,-8,-8)"/><ellipse cx="8" cy="-8" rx="7" ry="10" fill="#f09ab0" opacity="0.5" transform="rotate(30,8,-8)"/></g>
    <!-- Leaf 1 -->
    <path d="M25,680 Q48,670 42,655" fill="#4a8c5c" opacity="0.4" stroke="#4a8c5c" stroke-width="0.5"/>
    <!-- Rose 2 at 480 -->

<script>
// QR codes
window.addEventListener('load', () => {
  const make = (id, url, size) => {
    const el = document.getElementById(id);
    if (!el) return;
    new QRCode(el, { text:url, width:size, height:size, colorDark:'#2d1206', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.H });
    const img = el.querySelector('img');
    if (img) img.style.display = 'none';
  };
  make('qr-ig', 'https://www.instagram.com/forks.and.frames/', 82);
  make('qr-yt', 'https://www.youtube.com/@ForksNFrames', 82);
  make('qr-fb', 'https://www.facebook.com/profile.php?id=61590812694781', 82);
});

// Drift petals
const layer = document.getElementById('floralLayer');
const colors = ['#e05c7a','#f07040','#c8941f','#b05080','#8060c0','#4090d0','#4a8c5c','#f0a060','#f0c84a','#e890b0'];
const shapes = [
  (c) => `<svg width="16" height="22" viewBox="0 0 16 22" xmlns="http://www.w3.org/2000/svg"><ellipse cx="8" cy="11" rx="6" ry="10" fill="${c}" opacity="0.7"/></svg>`,
  (c) => `<svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="3" fill="${c}"/><ellipse cx="11" cy="4"  rx="3" ry="5" fill="${c}" opacity="0.65"/><ellipse cx="11" cy="18" rx="3" ry="5" fill="${c}" opacity="0.65"/><ellipse cx="4"  cy="11" rx="5" ry="3" fill="${c}" opacity="0.65"/><ellipse cx="18" cy="11" rx="5" ry="3" fill="${c}" opacity="0.65"/><ellipse cx="6"  cy="6"  rx="3" ry="5" fill="${c}" opacity="0.5" transform="rotate(-45,6,6)"/><ellipse cx="16" cy="6"  rx="3" ry="5" fill="${c}" opacity="0.5" transform="rotate(45,16,6)"/><ellipse cx="6"  cy="16" rx="3" ry="5" fill="${c}" opacity="0.5" transform="rotate(45,6,16)"/><ellipse cx="16" cy="16" rx="3" ry="5" fill="${c}" opacity="0.5" transform="rotate(-45,16,16)"/></svg>`,
  (c) => `<svg width="14" height="20" viewBox="0 0 14 20" xmlns="http://www.w3.org/2000/svg"><path d="M7 0 Q13 7 7 20 Q1 7 7 0Z" fill="${c}" opacity="0.55"/><line x1="7" y1="1" x2="7" y2="19" stroke="${c}" stroke-width="0.6" opacity="0.4"/></svg>`,
  (c) => `<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M8 1l1.8 4.8H15l-4 2.9 1.5 4.7L8 10.8l-4.5 2.6 1.5-4.7-4-2.9h5.2z" fill="${c}" opacity="0.7"/></svg>`,
  (c) => `<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="8" fill="none" stroke="${c}" stroke-width="1.5" opacity="0.6"/><circle cx="9" cy="9" r="3" fill="${c}" opacity="0.7"/></svg>`,
];

for (let i = 0; i < 28; i++) {
  const div = document.createElement('div');
  div.className = 'drift';
  const color = colors[Math.floor(Math.random() * colors.length)];
  const shape = shapes[Math.floor(Math.random() * shapes.length)](color);
  div.innerHTML = shape;
  const left  = Math.random() * 100;
  const dur   = 10 + Math.random() * 18;
  const delay = -(Math.random() * dur);
  const sz    = 0.5 + Math.random() * 1.4;
  div.style.cssText = `left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s;transform:scale(${sz});`;
  layer.appendChild(div);
}
</script>
